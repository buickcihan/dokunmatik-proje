<!-- DOKUNMATİK EKRAN DEEP-ZOOM SİSTEMİ BAŞLANGICI -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
    /* Kiosk koruması: Ekranın kazara yukarı aşağı kaymasını tamamen engeller */
    html, body {
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden !important;
        touch-action: none;
    }

    /* Mobirise'ın kendi kısıtlayıcı açılır pencerelerini devre dışı bırakıyoruz */
    .modal, .modal-backdrop, [data-toggle="modal"], [data-bs-toggle="modal"] { 
        display: none !important; 
        pointer-events: none !important; 
    }
    
    /* Büyük Görsel Penceresi */
    #dokunmatik-zoom-pencere {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000000 !important; display: none; justify-content: center;
        align-items: center; z-index: 999999 !important; overflow: hidden;
        touch-action: none;
    }
    
    /* Yakınlaşan Resim ve Sürükleme Alanı */
    .zoom-konteyner {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
    }
    
    #dokunmatik-zoom-img {
        max-width: 95%; max-height: 95%; object-fit: contain;
        transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
        transform: scale(1) translate(0px, 0px); cursor: zoom-in;
        position: absolute;
    }
    
    /* Geri Dön Butonu */
    #dokunmatik-kapat-btn {
        position: fixed; top: 25px; left: 25px; padding: 15px 35px;
        background: #ff4757; color: white; border: none; border-radius: 50px;
        font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        z-index: 1000000 !important;
    }
</style>

<div id="dokunmatik-zoom-pencere">
    <button id="dokunmatik-kapat-btn">⬅ GERİ DÖN</button>
    <div class="zoom-konteyner">
        <img id="dokunmatik-zoom-img" src="" alt="Zoom Image">
    </div>
</div>

<script>
    const pencere = document.getElementById('dokunmatik-zoom-pencere');
    const zoomImg = document.getElementById('dokunmatik-zoom-img');
    const kapatBtn = document.getElementById('dokunmatik-kapat-btn');

    let isDragging = false;
    let startX, startY;
    let translateX = 0, translateY = 0;
    let currentScale = 1;

    // Sayfadaki tüm Mobirise galeri elemanlarını yakalama (Baypas Modu)
    document.querySelectorAll('.gallery-image, .item-wrapper, .mbr-gallery img').forEach(eleman => {
        eleman.removeAttribute('data-toggle');
        eleman.removeAttribute('data-bs-toggle');
        eleman.removeAttribute('data-target');
        eleman.removeAttribute('data-bs-target');
        eleman.style.cursor = 'pointer';

        eleman.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            const asilResim = eleman.tagName === 'IMG' ? eleman : eleman.querySelector('img');
            
            if (asilResim) {
                zoomImg.src = asilResim.src;
                currentScale = 1;
                translateX = 0;
                translateY = 0;
                guncelleMatris();
                zoomImg.style.cursor = "zoom-in";
                pencere.style.display = 'flex';
            }
        }, true);
    });

    // Tıklandığında x3 Zoom In / Zoom Out mantığı
    zoomImg.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isDragging) return; // Sürüklerken zoom tetiklenmesin

        if (currentScale > 1) {
            currentScale = 1;
            translateX = 0;
            translateY = 0;
            zoomImg.style.cursor = "zoom-in";
        } else {
            currentScale = 3; // İdeal yakınlaşma oranı
            zoomImg.style.cursor = "zoom-out";
        }
        guncelleMatris();
    });

    // --- SÜRÜKLEME VE DOKUNMATİK KAYDIRMA MOTORU ---
    const surukleBasla = (e) => {
        if (currentScale === 1) return; // Resim büyümeden kaydırılmasın
        isDragging = true;
        const pointer = e.touches ? e.touches[0] : e;
        startX = pointer.clientX - translateX;
        startY = pointer.clientY - translateY;
        zoomImg.style.transition = 'none'; // Kaydırırken gecikme olmasın
    };

    const surukleDinamik = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const pointer = e.touches ? e.touches[0] : e;
        translateX = pointer.clientX - startX;
        translateY = pointer.clientY - startY;
        guncelleMatris();
    };

    const surukleBitis = () => {
        if (!isDragging) return;
        isDragging = false;
        zoomImg.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    };

    // Matris Güncelleme Fonksiyonu
    function guncelleMatris() {
        zoomImg.style.transform = `scale(${currentScale}) translate(${translateX / currentScale}px, ${translateY / currentScale}px)`;
    }

    // Dokunmatik ve mouse olaylarını bağlama
    zoomImg.addEventListener('mousedown', surukleBasla);
    window.addEventListener('mousemove', surukleDinamik);
    window.addEventListener('mouseup', surukleBitis);

    zoomImg.addEventListener('touchstart', surukleBasla, { passive: false });
    window.addEventListener('touchmove', surukleDinamik, { passive: false });
    window.addEventListener('touchend', surukleBitis);

    // Geri Dön Butonu işlevi
    kapatBtn.addEventListener('click', (e) => { 
        e.stopPropagation();
        pencere.style.display = 'none'; 
    });
</script>
