<script>
    const pencere = document.getElementById('dokunmatik-zoom-pencere');
    const zoomImg = document.getElementById('dokunmatik-zoom-img');
    const kapatBtn = document.getElementById('dokunmatik-kapat-btn');
    const btnSol = document.getElementById('nav-sol');
    const btnSag = document.getElementById('nav-sag');

    // Sayfadaki resimlerin yollarını dinamik olarak hafızaya alacak dizi
    let tumResimler = [];
    let aktifIndeks = 0;

    // Akıllı Dokunmatik Matris Hafızası
    let ev = {
        scale: 1, lastScale: 1,
        transX: 0, transY: 0,
        lastTransX: 0, lastTransY: 0,
        maxScale: 5, minScale: 1
    };

    let touchStartDist = 0;
    let isMultiTouch = false;
    let isDragging = false;
    let startX = 0, startY = 0;
    
    // Sağa/Sola Kaydırma (Swipe) Hafızası
    let swipeStartX = 0;
    let swipeStartY = 0;

    // Mobirise Galeri Tetikleyicilerini Yakalama ve Listeyi Doldurma
    const galeriResimleri = document.querySelectorAll('.gallery-image img, .item-wrapper img, .mbr-gallery img');
    galeriResimleri.forEach((img, indeks) => {
        tumResimler.push(img.src);
        
        const kapsayici = img.closest('.item-wrapper') || img.closest('.gallery-image') || img;
        kapsayici.removeAttribute('data-toggle');
        kapsayici.removeAttribute('data-bs-toggle');
        kapsayici.removeAttribute('data-target');
        kapsayici.removeAttribute('data-bs-target');
        kapsayici.style.cursor = 'pointer';

        kapsayici.addEventListener('click', (e) => {
            e.preventDefault(); e.stopPropagation();
            aktifIndeks = indeks;
            resimYukle(tumResimler[aktifIndeks]);
            pencere.style.display = 'flex';
        }, true);
    });

    function resimYukle(src) {
        zoomImg.src = src;
        ev.scale = 1; ev.lastScale = 1;
        ev.transX = 0; ev.transY = 0;
        ev.lastTransX = 0; ev.lastTransY = 0;
        guncelleEkran();
        oklariGuncelle();
    }

    function oklariGuncelle() {
        btnSol.style.display = aktifIndeks === 0 ? 'none' : 'flex';
        btnSag.style.display = aktifIndeks === tumResimler.length - 1 ? 'none' : 'flex';
    }

    function sonrakiResim() {
        if (aktifIndeks < tumResimler.length - 1) {
            aktifIndeks++;
            resimYukle(tumResimler[aktifIndeks]);
        }
    }

    function oncekiResim() {
        if (aktifIndeks > 0) {
            aktifIndeks--;
            resimYukle(tumResimler[aktifIndeks]);
        }
    }

    btnSag.addEventListener('click', (e) => { e.stopPropagation(); sonrakiResim(); });
    btnSol.addEventListener('click', (e) => { e.stopPropagation(); oncekiResim(); });

    const getDistance = (t1, t2) => Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);

    // DOKUNMA BAŞLANGICI
    zoomImg.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 2) {
            isMultiTouch = true;
            isDragging = false;
            touchStartDist = getDistance(e.touches[0], e.touches[1]);
            ev.lastScale = ev.scale;
        } else if (e.touches.length === 1) {
            if (ev.scale > 1) {
                isDragging = true;
                isMultiTouch = false;
                startX = e.touches[0].clientX - ev.transX;
                startY = e.touches[0].clientY - ev.transY;
            } else {
                // Resim orijinal boyuttayken swipe takibi başlat
                swipeStartX = e.touches[0].clientX;
                swipeStartY = e.touches[0].clientY;
            }
        }
    }, { passive: false });

    // DOKUNMA ANINDAKİ DİNAMİK HAREKET
    window.addEventListener('touchmove', (e) => {
        if (pencere.style.display !== 'flex') return;
        e.preventDefault();

        if (isMultiTouch && e.touches.length === 2) {
            const currentDist = getDistance(e.touches[0], e.touches[1]);
            let factor = currentDist / touchStartDist;
            let targetScale = ev.lastScale * factor;

            if (targetScale < ev.minScale) targetScale = ev.minScale;
            if (targetScale > ev.maxScale) targetScale = ev.maxScale;

            ev.scale = targetScale;
            guncelleEkran();
        } else if (isDragging && e.touches.length === 1 && ev.scale > 1) {
            ev.transX = e.touches[0].clientX - startX;
            ev.transY = e.touches[0].clientY - startY;
            guncelleEkran();
        }
    }, { passive: false });

    // DOKUNMA BİTİŞİ (SWIPE KONTROLÜ)
    window.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
            // Eğer resim büyütülmemişse ve tek parmak çekildiyse swipe kontrolü yap
            if (ev.scale === 1 && swipeStartX !== 0) {
                const diffX = e.changedTouches[0].clientX - swipeStartX;
                const diffY = e.changedTouches[0].clientY - swipeStartY;

                // Yatay eksende yeterli kaydırma yapıldıysa ve dikey hareket azsa
                if (Math.abs(diffX) > 60 && Math.abs(diffY) < 100) {
                    if (diffX > 0) {
                        oncekiResim(); // Sağa çekerse önceki resim
                    } else {
                        sonrakiResim(); // Sola çekerse sonraki resim
                    }
                }
            }
            isMultiTouch = false;
            isDragging = false;
            swipeStartX = 0;
            if (ev.scale === 1) {
                ev.transX = 0; ev.transY = 0;
                guncelleEkran();
            }
        } else if (e.touches.length === 1 && isMultiTouch) {
            isMultiTouch = false;
            isDragging = true;
            startX = e.touches[0].clientX - ev.transX;
            startY = e.touches[0].clientY - ev.transY;
        }
    });

    function guncelleEkran() {
        zoomImg.style.transform = `translate(${ev.transX}px, ${ev.transY}px) scale(${ev.scale})`;
    }

    kapatBtn.addEventListener('click', (e) => { 
        e.stopPropagation(); pencere.style.display = 'none'; 
    });
</script>
