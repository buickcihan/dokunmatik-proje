<script>
    /* -------------------------------------------------------------
       GELİŞMİŞ TOUCH / PINCH-ZOOM / SWIPE MOTORU
    ------------------------------------------------------------- */
    const modal = document.getElementById('modern-zoom-modal');
    const zoomImg = document.getElementById('modern-zoom-img');
    const closeBtn = document.getElementById('btn-close-lightbox');
    const resetBtn = document.getElementById('btn-reset-zoom');
    const prevBtn = document.getElementById('nav-prev');
    const nextBtn = document.getElementById('nav-next');
    const counterEl = document.getElementById('img-counter');

    let imageList = [];
    let currentIndex = 0;

    // Transform ve Dokunmatik Durum Değişkenleri
    let scale = 1;
    let lastScale = 1;
    let transX = 0;
    let transY = 0;
    let startX = 0;
    let startY = 0;
    let initialPinchDist = 0;
    
    let isMultiTouch = false;
    let isDragging = false;
    let swipeStartX = 0;
    let swipeStartY = 0;
    let lastTapTime = 0;

    // Galeri Görsellerini Otomatik Algılama
    document.querySelectorAll('.gallery-image img, .item-wrapper img, .mbr-gallery img').forEach((img) => {
        if (img.src && !imageList.includes(img.src)) {
            imageList.push(img.src);
        }
        
        const wrapper = img.closest('.item-wrapper') || img.closest('.gallery-image') || img;
        wrapper.removeAttribute('data-toggle');
        wrapper.removeAttribute('data-bs-toggle');
        wrapper.removeAttribute('data-target');
        wrapper.removeAttribute('data-bs-target');

        wrapper.style.cursor = 'pointer';
        wrapper.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            currentIndex = imageList.indexOf(img.src);
            openLightbox();
        }, true);
    });

    function openLightbox() {
        loadImage(imageList[currentIndex]);
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
    }

    function closeLightbox() {
        modal.classList.remove('active');
        setTimeout(() => {
            modal.style.display = 'none';
            resetZoom();
        }, 300);
    }

    function loadImage(src) {
        zoomImg.style.opacity = '0';
        zoomImg.src = src;
        resetZoom();
        
        zoomImg.onload = () => {
            zoomImg.style.opacity = '1';
        };
        updateUI();
    }

    function resetZoom() {
        scale = 1;
        lastScale = 1;
        transX = 0;
        transY = 0;
        zoomImg.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
        updateTransform();
    }

    function updateUI() {
        counterEl.textContent = `${currentIndex + 1} / ${imageList.length}`;
        prevBtn.style.opacity = currentIndex === 0 ? '0.3' : '1';
        prevBtn.style.pointerEvents = currentIndex === 0 ? 'none' : 'auto';
        nextBtn.style.opacity = currentIndex === imageList.length - 1 ? '0.3' : '1';
        nextBtn.style.pointerEvents = currentIndex === imageList.length - 1 ? 'none' : 'auto';
    }

    function nextImage() {
        if (currentIndex < imageList.length - 1) {
            currentIndex++;
            loadImage(imageList[currentIndex]);
        }
    }

    function prevImage() {
        if (currentIndex > 0) {
            currentIndex--;
            loadImage(imageList[currentIndex]);
        }
    }

    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });
    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
    closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    resetBtn.addEventListener('click', (e) => { e.stopPropagation(); resetZoom(); });

    // İki Nokta Arası Mesafe (Pinch Zoom Hesaplaması)
    const getDistance = (t1, t2) => Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);

    // DOKUNMA BAŞLANGICI
    zoomImg.addEventListener('touchstart', (e) => {
        e.preventDefault();
        
        // ÇİFT TIKLAMA (DOUBLE TAP TO TOGGLE ZOOM)
        const now = Date.now();
        const timeDiff = now - lastTapTime;
        
        if (timeDiff < 300 && timeDiff > 0 && e.touches.length === 1) {
            if (scale > 1.05) {
                resetZoom();
            } else {
                scale = 2.8;
                transX = 0;
                transY = 0;
                zoomImg.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
                updateTransform();
            }
            lastTapTime = 0;
            return;
        }
        lastTapTime = now;

        if (e.touches.length === 2) {
            // Pinch Zoom Başlangıcı
            isMultiTouch = true;
            isDragging = false;
            initialPinchDist = getDistance(e.touches[0], e.touches[1]);
            lastScale = scale;
            zoomImg.style.transition = 'none';
        } else if (e.touches.length === 1) {
            zoomImg.style.transition = 'none';
            if (scale > 1.05) {
                // Yakınlaştırılmış Durumda Pan (Sürükleme)
                isDragging = true;
                isMultiTouch = false;
                startX = e.touches[0].clientX - transX;
                startY = e.touches[0].clientY - transY;
            } else {
                // Orijinal Boyutta Sağ/Sol Swipe
                isDragging = false;
                isMultiTouch = false;
                swipeStartX = e.touches[0].clientX;
                swipeStartY = e.touches[0].clientY;
            }
        }
    }, { passive: false });

    // DOKUNMA HAREKETİ
    window.addEventListener('touchmove', (e) => {
        if (modal.style.display !== 'flex') return;
        
        if (isMultiTouch && e.touches.length === 2) {
            e.preventDefault();
            const currentDist = getDistance(e.touches[0], e.touches[1]);
            let targetScale = lastScale * (currentDist / initialPinchDist);

            if (targetScale < 1) targetScale = 1 - (1 - targetScale) * 0.3; // Elastic resistance
            if (targetScale > 4.5) targetScale = 4.5;

            scale = targetScale;
            updateTransform();
        } else if (isDragging && e.touches.length === 1 && scale > 1) {
            e.preventDefault();
            transX = e.touches[0].clientX - startX;
            transY = e.touches[0].clientY - startY;
            updateTransform();
        }
    }, { passive: false });

    // DOKUNMA BİTİŞİ
    window.addEventListener('touchend', (e) => {
        if (modal.style.display !== 'flex') return;

        if (e.touches.length === 0) {
            // SWIPE GEÇİŞ KONTROLÜ
            if (scale <= 1.05 && swipeStartX !== 0 && e.changedTouches && e.changedTouches.length > 0) {
                const diffX = e.changedTouches[0].clientX - swipeStartX;
                const diffY = e.changedTouches[0].clientY - swipeStartY;

                if (Math.abs(diffX) > 50 && Math.abs(diffY) < 70) {
                    if (diffX > 0) { prevImage(); } else { nextImage(); }
                }
            }
            
            isMultiTouch = false;
            isDragging = false;
            swipeStartX = 0;
            
            // Zoom Min Sınırına Geri Dönme
            if (scale < 1) {
                resetZoom();
            }
        } else if (e.touches.length === 1) {
            isMultiTouch = false;
            if (scale > 1) {
                isDragging = true;
                startX = e.touches[0].clientX - transX;
                startY = e.touches[0].clientY - transY;
            }
        }
    });

    function updateTransform() {
        zoomImg.style.transform = `translate3d(${transX}px, ${transY}px, 0px) scale(${scale})`;
    }

    // KLAVYEYLE GEZİNME VE ESC DESTEĞİ
    document.addEventListener('keydown', (e) => {
        if (modal.style.display === 'flex') {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        }
    });
</script>
