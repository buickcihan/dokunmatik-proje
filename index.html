<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <link rel="shortcut icon" href="assets/images/logo5.png" type="image/x-icon">
  <title>Ana Sayfa</title>
  
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/theme/css/style.css">
  <link rel="preload" href="https://fonts.googleapis.com/css?family=Inter+Tight:100,200,300,400,500,600,700,800,900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

  <style>
    body {
      background: #0f1015;
      color: #ffffff;
      font-family: 'Inter Tight', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-container {
      padding: 40px 20px;
      width: 100%;
      max-width: 1100px;
    }

    .kiosk-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 24px;
      text-decoration: none !important;
      color: #fff !important;
      display: block;
      backdrop-filter: blur(20px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      height: 100%;
    }

    .kiosk-card:hover, .kiosk-card:active {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 25px 45px rgba(0,0,0,0.6);
    }

    .img-box {
      width: 100%;
      height: 380px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .kiosk-card:hover .img-box img {
      transform: scale(1.05);
    }

    .card-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-desc {
      color: rgba(255, 255, 255, 0.65);
      font-size: 15px;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="row g-4 justify-content-center">
      <div class="col-12 col-md-6">
        <a href="page1.html" class="kiosk-card">
          <div class="img-box">
            <img src="assets/images/images-35-852x1181.jpg" alt="Dergi Kapakları">
          </div>
          <h3 class="card-title">Dergi Kapakları</h3>
          <p class="card-desc">Dergi kapaklarını detaylı incelemek için dokunun</p>
        </a>
      </div>
      <div class="col-12 col-md-6">
        <a href="page2.html" class="kiosk-card">
          <div class="img-box">
            <img src="assets/images/11.jpg" alt="Videolar">
          </div>
          <h3 class="card-title">Videolar</h3>
          <p class="card-desc">Video içeriklerini izlemek için dokunun</p>
        </a>
      </div>
    </div>
  </div>

<script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
