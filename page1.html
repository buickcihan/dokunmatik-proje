  <style>
    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: 'Inter Tight', sans-serif;
      padding-top: 80px;
    }

    /* Sabit Ana Sayfaya Dön Butonu */
    .btn-home-fixed {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 99999;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: #fff !important;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      text-decoration: none !important;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: all 0.25s ease;
    }

    .btn-home-fixed:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .gallery-grid {
      padding: 10px 20px 40px 20px;
    }

    .gallery-item-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #16181f;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      margin-bottom: 24px;
    }

    .gallery-item-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    .gallery-item-card img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      display: block;
    }

    /* MODERN LIGHTBOX / TOUCH ZOOM STİLLERİ */
    .modal, .modal-backdrop, [data-toggle="modal"], [data-bs-toggle="modal"] { 
        display: none !important; 
        pointer-events: none !important; 
    }

    #modern-zoom-modal {
        position: fixed !important; 
        top: 0 !important; 
        left: 0 !important; 
        width: 100vw !important; 
        height: 100vh !important;
        background: rgba(5, 5, 8, 0.95) !important; 
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        display: none; 
        justify-content: center; 
        align-items: center; 
        z-index: 9999999 !important; 
        overflow: hidden !important;
        touch-action: none !important;
        user-select: none;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    #modern-zoom-modal.active { opacity: 1; }

    .zoom-viewport {
        width: 100%; height: 100%; display: flex;
        justify-content: center; align-items: center;
        overflow: hidden; position: relative;
    }

    #modern-zoom-img {
        max-width: 92%; max-height: 92%; object-fit: contain;
        transform-origin: center center;
        transform: translate3d(0px, 0px, 0px) scale(1);
        position: absolute; will-change: transform;
        border-radius: 8px; box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }

    .lightbox-top-bar {
        position: fixed; top: 0; left: 0; width: 100%;
        padding: 20px 24px; display: flex;
        justify-content: space-between; align-items: center;
        z-index: 10000001 !important;
        pointer-events: none;
    }

    .lightbox-counter {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px; font-weight: 600;
        background: rgba(255, 255, 255, 0.12);
        padding: 8px 16px; border-radius: 20px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .lightbox-actions { display: flex; gap: 12px; pointer-events: auto; }

    .glass-btn {
        width: 46px; height: 46px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff; display: flex; justify-content: center;
        align-items: center; cursor: pointer;
        backdrop-filter: blur(10px); transition: all 0.2s ease;
    }

    .glass-btn:hover { background: rgba(255, 255, 255, 0.25); }

    .nav-arrow {
        position: fixed; top: 50%; transform: translateY(-50%);
        width: 54px; height: 54px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff; display: flex; justify-content: center;
        align-items: center; cursor: pointer; z-index: 10000000 !important;
        backdrop-filter: blur(10px); transition: all 0.25s ease;
    }

    #nav-prev { left: 24px; } #nav-next { right: 24px; }
  </style>

  <!-- LIGHTBOX PENCERESİ -->
  <div id="modern-zoom-modal">
    <div class="lightbox-top-bar">
        <div class="lightbox-counter" id="img-counter">1 / 43</div>
        <div class="lightbox-actions">
            <button class="glass-btn" id="btn-reset-zoom" title="Sıfırla">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </button>
            <button class="glass-btn" id="btn-close-lightbox" title="Kapat">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>

    <button id="nav-next" class="nav-arrow"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>

    <div class="zoom-viewport">
        <img id="modern-zoom-img" src="" alt="Görsel">
    </div>

<script>
    const modal = document.getElementById('modern-zoom-modal');
    const zoomImg = document.getElementById('modern-zoom-img');
    const closeBtn = document.getElementById('btn-close-lightbox');
    const resetBtn = document.getElementById('btn-reset-zoom');
    const prevBtn = document.getElementById('nav-prev');
    const nextBtn = document.getElementById('nav-next');
    const counterEl = document.getElementById('img-counter');

    let imageList = [];
    let currentIndex = 0;

    let scale = 1, lastScale = 1;
    let transX = 0, transY = 0;
    let startX = 0, startY = 0;
    let initialPinchDist = 0;
    let isMultiTouch = false, isDragging = false;
    let swipeStartX = 0, swipeStartY = 0;
    let lastTapTime = 0;

    document.querySelectorAll('#gallery-container img').forEach((img) => {
        if (!imageList.includes(img.src)) imageList.push(img.src);
        
        img.closest('.gallery-item-card').addEventListener('click', () => {
            currentIndex = imageList.indexOf(img.src);
            openLightbox();
        });
    });

    function openLightbox() {
        loadImage(imageList[currentIndex]);
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
    }

    function closeLightbox() {
        modal.classList.remove('active');
        setTimeout(() => { modal.style.display = 'none'; resetZoom(); }, 300);
    }

    function loadImage(src) {
        zoomImg.style.opacity = '0';
        zoomImg.src = src;
        resetZoom();
        zoomImg.onload = () => { zoomImg.style.opacity = '1'; };
        updateUI();
    }

    function resetZoom() {
        scale = 1; lastScale = 1; transX = 0; transY = 0;
        zoomImg.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
        updateTransform();
    }

    function updateUI() {
        counterEl.textContent = `${currentIndex + 1} / ${imageList.length}`;
        prevBtn.style.opacity = currentIndex === 0 ? '0.3' : '1';
        nextBtn.style.opacity = currentIndex === imageList.length - 1 ? '0.3' : '1';
    }

    function nextImage() { if (currentIndex < imageList.length - 1) { currentIndex++; loadImage(imageList[currentIndex]); } }
    function prevImage() { if (currentIndex > 0) { currentIndex--; loadImage(imageList[currentIndex]); } }

    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });
    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
    closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    resetBtn.addEventListener('click', (e) => { e.stopPropagation(); resetZoom(); });

    const getDistance = (t1, t2) => Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);

    zoomImg.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const now = Date.now();
        if (now - lastTapTime < 300 && e.touches.length === 1) {
            if (scale > 1.05) resetZoom();
            else { scale = 2.8; transX = 0; transY = 0; zoomImg.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)'; updateTransform(); }
            lastTapTime = 0; return;
        }
        lastTapTime = now;

        if (e.touches.length === 2) {
            isMultiTouch = true; isDragging = false;
            initialPinchDist = getDistance(e.touches[0], e.touches[1]);
            lastScale = scale; zoomImg.style.transition = 'none';
        } else if (e.touches.length === 1) {
            zoomImg.style.transition = 'none';
            if (scale > 1.05) {
                isDragging = true; isMultiTouch = false;
                startX = e.touches[0].clientX - transX;
                startY = e.touches[0].clientY - transY;
            } else {
                isDragging = false; isMultiTouch = false;
                swipeStartX = e.touches[0].clientX;
                swipeStartY = e.touches[0].clientY;
            }
        }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if (modal.style.display !== 'flex') return;
        if (isMultiTouch && e.touches.length === 2) {
            e.preventDefault();
            let targetScale = lastScale * (getDistance(e.touches[0], e.touches[1]) / initialPinchDist);
            if (targetScale < 1) targetScale = 1 - (1 - targetScale) * 0.3;
            if (targetScale > 4.5) targetScale = 4.5;
            scale = targetScale; updateTransform();
        } else if (isDragging && e.touches.length === 1 && scale > 1) {
            e.preventDefault();
            transX = e.touches[0].clientX - startX;
            transY = e.touches[0].clientY - startY;
            updateTransform();
        }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
        if (modal.style.display !== 'flex') return;
        if (e.touches.length === 0) {
            if (scale <= 1.05 && swipeStartX !== 0 && e.changedTouches && e.changedTouches.length > 0) {
                const diffX = e.changedTouches[0].clientX - swipeStartX;
                const diffY = e.changedTouches[0].clientY - swipeStartY;
                if (Math.abs(diffX) > 50 && Math.abs(diffY) < 70) {
                    if (diffX > 0) prevImage(); else nextImage();
                }
            }
            isMultiTouch = false; isDragging = false; swipeStartX = 0;
            if (scale < 1) resetZoom();
        }
    });

    function updateTransform() {
        zoomImg.style.transform = `translate3d(${transX}px, ${transY}px, 0px) scale(${scale})`;
    }
</script>
