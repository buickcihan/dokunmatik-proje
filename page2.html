<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="assets/images/logo5.png" type="image/x-icon">
  <title>Video</title>
  
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/theme/css/style.css">
  <link rel="preload" href="https://fonts.googleapis.com/css?family=Inter+Tight:100,200,300,400,500,600,700,800,900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

  <style>
    body {
      background: #0d0e12;
      color: #fff;
      font-family: 'Inter Tight', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .btn-home-fixed {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 99999;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: #fff !important;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      text-decoration: none !important;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: all 0.25s ease;
    }

    .btn-home-fixed:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .video-card {
      width: 100%;
      max-width: 960px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(15px);
    }

    video {
      width: 100%;
      height: auto;
      border-radius: 16px;
      display: block;
    }
  </style>
</head>
<body>

  <a href="index_2.html" class="btn-home-fixed">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Ana Sayfa
  </a>

  <div class="video-card">
    <video controls autoplay muted loop playsinline>
      <source src="assets/videos/deneme.mp4" type="video/mp4">
      Tarayıcınız video etiketini desteklemiyor.
    </video>
  </div>

<script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
